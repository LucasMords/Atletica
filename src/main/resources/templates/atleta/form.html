<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${atleta.id == 0 ? 'Novo atleta' : 'Editar atleta'} + ' | Atlética IFTO'">Novo atleta | Atlética IFTO</title>
    <link rel="stylesheet" th:href="@{/css/atletica.css}">
</head>
<body>
<div class="app-shell">
    <aside class="sidebar">
        <a class="brand" th:href="@{/atleta/list}">
            <span class="brand-mark">A</span>
            <span><strong>ATLÉTICA</strong><small>IFTO • gestão esportiva</small></span>
        </a>
        <nav class="side-nav" aria-label="Navegação principal">
            <a class="nav-link" th:href="@{/atleta/list}"><span class="nav-icon">⌂</span>Atletas</a>
            <a class="nav-link active" th:href="@{/atleta/form}"><span class="nav-icon">＋</span>Novo cadastro</a>
        </nav>
        <div class="sidebar-footer"><span class="status-dot"></span>Sistema ativo</div>
    </aside>

    <main class="content form-content">
        <a class="back-link" th:href="@{/atleta/list}">← Voltar para atletas</a>
        <header class="topbar form-header">
            <div>
                <p class="eyebrow" th:text="${atleta.id == 0 ? 'Novo cadastro' : 'Atualização de cadastro'}">Novo cadastro</p>
                <h1 th:text="${atleta.id == 0 ? 'Cadastrar atleta' : 'Editar atleta'}">Cadastrar atleta</h1>
                <p class="subtitle">Preencha os dados do integrante abaixo.</p>
            </div>
        </header>

        <section class="form-panel">
            <form th:object="${atleta}" th:action="${atleta.id == 0 ? '/atleta/save' : '/atleta/update'}" method="post">
                <input type="hidden" th:field="*{id}">
                <div class="form-section-title">
                    <span class="section-number">01</span>
                    <div><h2>Dados pessoais</h2><p>Informações básicas do atleta.</p></div>
                </div>

                <div class="form-grid">
                    <div class="field field-wide"><label for="nome">Nome completo <span>*</span></label><input id="nome" type="text" th:field="*{nome}" placeholder="Ex.: Maria da Silva" required></div>
                    <div class="field"><label for="matricula">Matrícula</label><input id="matricula" type="text" th:field="*{matricula}" placeholder="Ex.: 2024001234"></div>
                    <div class="field">
                        <label for="dataNascimento">Data de nascimento <span>*</span></label>
                        <input id="dataNascimento" type="date" name="dataNascimento"
                               th:value="${atleta.dataNascimento != null ? #temporals.format(atleta.dataNascimento, 'yyyy-MM-dd') : ''}"
                               required>
                    </div>
                    <div class="field"><label for="celular">Celular</label><input id="celular" type="tel" th:field="*{celular}" placeholder="(63) 99999-9999"></div>
                </div>

                <div class="form-divider"></div>
                <div class="form-section-title">
                    <span class="section-number">02</span>
                    <div><h2>Informações esportivas</h2><p>Defina a modalidade principal do atleta.</p></div>
                </div>

                <div class="form-grid single-column">
                    <div class="field field-wide">
                        <label for="modalidade">Modalidade</label>
                        <select id="modalidade" th:field="*{modalidade}">
                            <option value="">Selecione uma modalidade</option>
                            <option th:each="modalidade : ${modalidades}" th:value="${modalidade.id}" th:text="${modalidade.nome}">Modalidade</option>
                        </select>
                    </div>
                </div>

                <div class="form-actions">
                    <a class="button button-secondary" th:href="@{/atleta/list}">Cancelar</a>
                    <button class="button button-primary" type="submit"><span>✓</span><span th:text="${atleta.id == 0 ? 'Salvar atleta' : 'Atualizar atleta'}">Salvar atleta</span></button>
                </div>
            </form>
        </section>
    </main>
</div>
</body>
</html>
