spring.application.name=Atletica

# Banco H2 em memoria - ambiente de desenvolvimento
spring.datasource.url=jdbc:h2:mem:atletica;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Recria as tabelas a cada execucao e executa o import.sql
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Console web do H2
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Facilita o desenvolvimento das telas Thymeleaf
spring.thymeleaf.cache=false
